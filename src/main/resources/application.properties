# ── Application ───────────────────────────────────────────────────────
spring.application.name=projetpi
server.port=8084

# ── Base de données MySQL ──────────────────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/projetpi?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────
# "none" : Hibernate ne touche plus au schéma → supprime les warnings ALTER TABLE
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
# MySQL8Dialect : supprime le warning "5.5.0 version no longer supported"
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# Ligne suivante commentée : Eureka est désactivé, cette URL est ignorée
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true
#eureka.instance.ip-address=10.227.115.9

# ── CORS pour Angular ──────────────────────────────────────────────────
spring.web.cors.allowed-origins=http://localhost:4200

# ── Upload fichiers ────────────────────────────────────────────────────
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB