apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-projets
  namespace: syncra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ms-projets
  template:
    metadata:
      labels:
        app: ms-projets
    spec:
      containers:
        - name: ms-projets
          image: syncra/ms-projets:latest
          ports:
            - containerPort: 8082
          env:
            - name: EUREKA_URL
              value: http://eureka:8761/eureka/
---
apiVersion: v1
kind: Service
metadata:
  name: ms-projets
  namespace: syncra
spec:
  selector:
    app: ms-projets
  ports:
    - port: 8082
      targetPort: 8082