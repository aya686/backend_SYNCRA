# ================================
# Configuration Base de Données
# ================================
spring.datasource.url=jdbc:mysql://localhost:3306/pi_ms5_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ================================
# Configuration JPA / Hibernate
# ================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ? SUPPRIMER COMPLETEMENT la ligne MySQL8Dialect
# spring.jpa.properties.hibernate.dialect   ? NE PAS METTRE

# ================================
# Configuration Serveur
# ================================
server.port=8085
spring.application.name=pi-ms5
spring.jackson.serialization.fail-on-empty-beans=false
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
#eureka.instance.ip-address=127.0.0.1
eureka.instance.prefer-ip-address=true
